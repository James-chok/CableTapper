name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler: "2.4.22"
          bundler-cache: true

      - name: Prepare signing files
        env:
          # DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          DISTRIBUTION_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          PROFILE_BASE64: ${{ secrets.MAC_APPSTORE_PROFILE_BASE64 }}
        run: |
          # echo "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer_id.p12"
          echo "$DISTRIBUTION_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.provisionprofile"
          {
            # echo "DEVELOPER_ID_P12_PATH=$RUNNER_TEMP/developer_id.p12"
            echo "APPLE_DISTRIBUTION_P12_PATH=$RUNNER_TEMP/distribution.p12"
            echo "MAC_APPSTORE_PROFILE_PATH=$RUNNER_TEMP/profile.provisionprofile"
          } >> "$GITHUB_ENV"

      - name: Build and upload
        env:
          # DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_PASSWORD }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
        run: bundle exec fastlane release

      # - name: Publish GitHub release
      #   env:
      #     GH_TOKEN: ${{ github.token }}
      #   run: |
      #     gh release create "$GITHUB_REF_NAME" \
      #       "dist/CableTapper-$GITHUB_REF_NAME.zip" \
      #       "dist/CableTapper-$GITHUB_REF_NAME.sha256" \
      #       --verify-tag --generate-notes --title "CableTapper $GITHUB_REF_NAME"
